# Infraestructura local de Memora: PostgreSQL, Silo (S3) y Mailpit.
# Uso: docker compose up -d
# Las credenciales y puertos salen de variables de entorno con defaults locales.
# No se versiona ningún .env real: copia .env.example a .env si necesitas cambiarlos.

name: memora

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora}
      POSTGRES_DB: ${POSTGRES_DB:-memora}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - memora

  minio:
    # MinIO dejó de publicar su edición comunitaria y archivó el repositorio;
    # se usa Silo (`pgsty/silo`), el fork mantenido que conserva la API S3, las
    # variables MINIO_*, las rutas /minio/* y el formato de datos. Solo local,
    # fijado por tag + digest multi-arch para que `docker compose up` sea
    # reproducible y no arrastre un tag movido.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    restart: unless-stopped
    # La imagen arranca como root y Docker crea el volumen como root, así que
    # /data es escribible sin overrides. Solo local: en producción el
    # almacenamiento es R2/S3 gestionado, no este contenedor.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memora123}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - memora

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - memora

networks:
  memora:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
