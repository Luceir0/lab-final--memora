# Infraestructura local de Memora: PostgreSQL, MinIO y Mailpit.
# Uso: docker compose up -d
# Las credenciales y puertos salen de variables de entorno con defaults locales.
# No se versiona ningún .env real: copia .env.example a .env si necesitas cambiarlos.

name: memora

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora}
      POSTGRES_DB: ${POSTGRES_DB:-memora}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - memora

  minio:
    # Las imágenes oficiales de MinIO dejaron de publicarse; se usa el mirror
    # `alpine/minio` (solo local), fijado por tag + digest multi-arch para que
    # `docker compose up` sea reproducible y no arrastre un tag movido.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    restart: unless-stopped
    # La imagen declara `USER minio` (uid 100) pero no ajusta permisos del volumen,
    # que Docker crea como root. En local arrancamos como root para que /data sea escribible.
    # Solo local: en producción el almacenamiento es R2/S3 gestionado, no este contenedor.
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memora123}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - memora

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - memora

networks:
  memora:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
